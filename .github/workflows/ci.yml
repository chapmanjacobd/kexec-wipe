name: CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assemble self-contained wipe.sh
        run: ./build.sh

      - name: Verify wipe.sh is up to date
        run: |
          if ! git diff --exit-code wipe.sh; then
            echo "::error::wipe.sh is out of date. Run ./build.sh and commit."
            exit 1
          fi

      - name: Syntax check all scripts
        run: |
          set -e
          bash -n wipe.sh
          for f in lib/*.sh; do bash -n "$f"; done
          sh -n initramfs/init
          bash -n initramfs/build.sh
          bash -n build.sh
          bash -n scripts/qemu-full-install-test.sh
          echo "All syntax checks passed."

      - name: Test argument parsing
        run: |
          set -e
          bash wipe.sh --help
          cat wipe.sh | bash -s -- --help
          ! bash wipe.sh 2>/dev/null
          ! bash wipe.sh /dev/fake --method=invalid 2>/dev/null
          ! bash wipe.sh /dev/sda 2>/dev/null
          ! bash wipe.sh /dev/sda --install-fedora 2>/dev/null

      - name: Install nvme-cli
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nvme-cli

      - name: Build initramfs (no Docker)
        run: ./initramfs/build.sh --no-docker --output=/tmp/initramfs.cpio.gz

      - name: Verify initramfs contents
        run: |
          mkdir -p /tmp/initramfs-check
          cd /tmp/initramfs-check
          zcat /tmp/initramfs.cpio.gz | cpio -idm 2>/dev/null

          test -f bin/busybox
          test -f bin/nvme
          test -f init && test -x init

          test -L bin/sh
          test -L bin/mount
          test -L bin/reboot

          LD_LIBRARY_PATH=./lib ldd bin/nvme >/dev/null 2>&1

          echo "Initramfs verification passed."

  integration:
    name: Integration (x86_64 initramfs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build initramfs (with Docker)
        run: ./initramfs/build.sh --output=/tmp/initramfs-docker.cpio.gz

      - name: Verify initramfs (with Docker)
        run: |
          mkdir -p /tmp/initramfs-docker-check
          cd /tmp/initramfs-docker-check
          zcat /tmp/initramfs-docker.cpio.gz | cpio -idm 2>/dev/null

          test -f bin/busybox
          test -f bin/nvme
          test -f init && test -x init

          test -L bin/sh
          test -L bin/mount
          test -L bin/reboot

          LD_LIBRARY_PATH=./lib ldd bin/nvme >/dev/null 2>&1

          echo "Initramfs verification passed."

  # Real Fedora end-to-end install tests (scripts/qemu-full-install-test.sh):
  # boot an actual Fedora Cloud guest, run the real wipe.sh inside it, install
  # real Fedora onto a virtual NVMe, reboot, and verify ssh works.
  install-fedora:
    name: Install Fedora in QEMU (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            apt: qemu-system-x86 qemu-utils ovmf genisoimage socat
          - arch: aarch64
            # aarch64 runners boot a real Fedora aarch64 guest, which uses
            # Unified Kernel Images, so the UKI kexec path is exercised for real.
            runner: ubuntu-26.04-arm
            apt: qemu-system-arm qemu-utils ovmf genisoimage socat
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }}

      - name: Generate ssh key for the test
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          if [ ! -f "$HOME/.ssh/id_ed25519" ]; then
            ssh-keygen -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          fi

      # x86_64 runners expose /dev/kvm but it is root:kvm 660 by default, so
      # grant the runner user access. ARM64 runners have no /dev/kvm at all;
      # then the test script's TCG fallback kicks in.
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Real Fedora install test (${{ matrix.arch }})
        timeout-minutes: 90
        run: scripts/qemu-full-install-test.sh --arch=${{ matrix.arch }} --mem=4096

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [test, integration, install-fedora]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"

  upload-release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Assemble self-contained wipe.sh
        run: ./build.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release upload "${VERSION}" \
            wipe.sh \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
