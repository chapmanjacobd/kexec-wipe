name: CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble self-contained wipe.sh
        run: ./build.sh

      - name: Verify wipe.sh is up to date
        run: |
          ./build.sh --output=/tmp/wipe-check.sh
          if ! diff -u wipe.sh /tmp/wipe-check.sh; then
            echo "::error::wipe.sh is out of date. Run ./build.sh and commit."
            exit 1
          fi

      - name: Syntax check all scripts
        run: |
          set -e
          bash -n wipe.sh
          for f in lib/*.sh; do bash -n "$f"; done
          sh -n initramfs/init
          bash -n initramfs/build.sh
          bash -n build.sh
          echo "All syntax checks passed."

      - name: Test pipe execution
        run: |
          bash wipe.sh --help
          cat wipe.sh | bash -s -- --help

      - name: Build initramfs (no Docker)
        run: ./initramfs/build.sh --no-docker --output=/tmp/kexec-wipe-initramfs.cpio.gz

      - name: Verify initramfs contents
        run: |
          mkdir -p /tmp/initramfs-check
          cd /tmp/initramfs-check
          zcat /tmp/kexec-wipe-initramfs.cpio.gz | cpio -idm 2>/dev/null

          # Check required files exist
          test -f bin/busybox
          test -f bin/nvme
          test -f init
          test -x init

          # Check busybox symlinks
          test -L bin/sh
          test -L bin/mount
          test -L bin/reboot

          # Check nvme can load its libraries
          LD_LIBRARY_PATH=./lib ldd bin/nvme >/dev/null 2>&1

          echo "Initramfs verification passed."

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"

  upload_release_assets:
    name: Upload release asset
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assemble self-contained wipe.sh
        run: ./build.sh

      - name: Build initramfs (with Docker for static nvme-cli)
        run: ./initramfs/build.sh --output=kexec-wipe-initramfs.cpio.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract version from tag
          VERSION="${GITHUB_REF_NAME}"
          INITRAMFS_VERSION=$(grep 'INITRAMFS_VERSION=' lib/kexec.sh | head -1 | cut -d'"' -f2)
          INITRAMFS_ASSET="kexec-wipe-initramfs-${INITRAMFS_VERSION}.cpio.gz"

          # Rename to versioned filename
          cp kexec-wipe-initramfs.cpio.gz "${INITRAMFS_ASSET}"

          # Upload both wipe.sh and initramfs
          gh release upload "${VERSION}" \
            wipe.sh \
            "${INITRAMFS_ASSET}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
