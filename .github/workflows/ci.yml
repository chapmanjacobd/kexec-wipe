name: CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assemble self-contained wipe.sh
        run: ./build.sh

      - name: Verify wipe.sh is up to date
        run: |
          ./build.sh --output=/tmp/wipe-check.sh
          if ! diff -u wipe.sh /tmp/wipe-check.sh; then
            echo "::error::wipe.sh is out of date. Run ./build.sh and commit."
            exit 1
          fi

      - name: Syntax check all scripts
        run: |
          set -e
          bash -n wipe.sh
          for f in lib/*.sh; do bash -n "$f"; done
          sh -n initramfs/init
          bash -n initramfs/build.sh
          bash -n build.sh
          echo "All syntax checks passed."

      - name: Test argument parsing
        run: |
          set -e
          bash wipe.sh --help
          cat wipe.sh | bash -s -- --help
          ! bash wipe.sh 2>/dev/null
          ! bash wipe.sh /dev/fake --method=invalid 2>/dev/null
          ! bash wipe.sh /dev/sda 2>/dev/null
          ! bash wipe.sh /dev/sda --install-fedora 2>/dev/null

      - name: Install nvme-cli
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nvme-cli

      - name: Build initramfs (no Docker)
        run: ./initramfs/build.sh --no-docker --output=/tmp/initramfs.cpio.gz

      - name: Verify initramfs contents
        run: |
          mkdir -p /tmp/initramfs-check
          cd /tmp/initramfs-check
          zcat /tmp/initramfs.cpio.gz | cpio -idm 2>/dev/null

          test -f bin/busybox
          test -f bin/nvme
          test -f init && test -x init

          test -L bin/sh
          test -L bin/mount
          test -L bin/reboot

          LD_LIBRARY_PATH=./lib ldd bin/nvme >/dev/null 2>&1

          echo "Initramfs verification passed."

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build initramfs (with Docker)
        run: ./initramfs/build.sh --output=/tmp/initramfs-docker.cpio.gz

      - name: Verify initramfs (with Docker)
        run: |
          mkdir -p /tmp/initramfs-docker-check
          cd /tmp/initramfs-docker-check
          zcat /tmp/initramfs-docker.cpio.gz | cpio -idm 2>/dev/null

          test -f bin/busybox
          test -f bin/nvme
          test -f init && test -x init

          test -L bin/sh
          test -L bin/mount
          test -L bin/reboot

          LD_LIBRARY_PATH=./lib ldd bin/nvme >/dev/null 2>&1

          echo "Initramfs verification passed."

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 linux-image-generic

      - name: QEMU smoke test
        run: |
          KERNEL=$(ls /boot/vmlinuz-* | head -1)
          echo "Using kernel: $KERNEL"
          sudo cp "$KERNEL" /tmp/vmlinuz
          sudo chmod 644 /tmp/vmlinuz

          timeout 30 qemu-system-x86_64 \
            -kernel /tmp/vmlinuz \
            -initrd /tmp/initramfs-docker.cpio.gz \
            -append "console=ttyS0 kexec_wipe_dev=/dev/nvme0n1 kexec_wipe_method=auto" \
            -nographic -no-reboot -m 512 \
            > /tmp/serial.log 2>&1 || true

          echo "--- Serial output ---"
          cat /tmp/serial.log
          echo "--- End serial output ---"

          grep -q "kexec-wipe initramfs" /tmp/serial.log
          echo "QEMU smoke test passed."

      - name: QEMU Fedora install test
        run: |
          set -euo pipefail

          # --- Prepare a test initramfs that can bring up an emulated NVMe.
          # The runner kernel exposes the nvme driver as modules, so stage them
          # (plus modprobe metadata) into a copy of our built initramfs.
          rm -rf /tmp/install-initramfs
          mkdir -p /tmp/install-initramfs
          cd /tmp/install-initramfs
          zcat /tmp/initramfs-docker.cpio.gz | cpio -idm 2>/dev/null

          KVER=$(uname -r)
          SRC_MODS="/lib/modules/$KVER"
          DST_MODS="/tmp/install-initramfs/lib/modules/$KVER"
          mkdir -p "$DST_MODS/kernel/drivers/nvme"
          if [ -d "$SRC_MODS/kernel/drivers/nvme" ]; then
            cp -a "$SRC_MODS/kernel/drivers/nvme"/* "$DST_MODS/kernel/drivers/nvme/"
          fi
          # Stage virtio-net modules so the guest can bring up a NIC for DHCP.
          mkdir -p "$DST_MODS/kernel/drivers/net"
          for f in "$SRC_MODS"/kernel/drivers/net/virtio_net*; do
            [ -e "$f" ] && cp -a "$f" "$DST_MODS/kernel/drivers/net/"
          done
          # Overwrite with the full host module metadata so modprobe resolves.
          for f in modules.dep modules.dep.bin modules.builtin modules.builtin.bin modules.alias modules.alias.bin modules.symbols; do
            [ -f "$SRC_MODS/$f" ] && cp "$SRC_MODS/$f" "$DST_MODS/$f" 2>/dev/null || true
          done
          cd /
          ( cd /tmp/install-initramfs && find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > /tmp/install-initramfs.cpio.gz )

          # --- Build a small bootable synthetic "Fedora" raw image.
          # A single ext4 partition seeded with a busybox init that prints a
          # marker and powers off, so the test validates the whole post-sanitize
          # install path (network, download+checksum, write, switch_root).
          rm -f /tmp/fedora.raw /tmp/fedora.raw.xz
          dd if=/dev/zero of=/tmp/fedora.raw bs=1M count=96 status=none
          printf 'o\nn\np\n1\n\n+80M\nw\n' | fdisk /tmp/fedora.raw >/dev/null 2>&1
          LOOP=$(sudo losetup -fP --show /tmp/fedora.raw)
          sudo partprobe "$LOOP" 2>/dev/null || true
          sleep 1
          sudo mkfs.ext4 -q "${LOOP}p1"

          rm -rf /tmp/fedora-root
          mkdir -p /tmp/fedora-root
          sudo mount "${LOOP}p1" /tmp/fedora-root
          sudo mkdir -p /tmp/fedora-root/bin /tmp/fedora-root/sbin \
            /tmp/fedora-root/dev /tmp/fedora-root/proc /tmp/fedora-root/sys
          sudo cp /tmp/install-initramfs/bin/busybox /tmp/fedora-root/bin/busybox
          sudo ln -sf busybox /tmp/fedora-root/bin/sh
          sudo mkdir -p /tmp/fedora-root/boot/grub2
          sudo touch /tmp/fedora-root/boot/grub2/grub.cfg
          printf '%s\n' '#!/bin/sh' \
            'echo "KEXEC-WIPE-TEST-INSTALL-BOOT-OK"' \
            'sync' \
            'sleep 1' \
            '/bin/busybox poweroff -f' > /tmp/fedora-init
          sudo cp /tmp/fedora-init /tmp/fedora-root/sbin/init
          sudo chmod +x /tmp/fedora-root/sbin/init
          sudo umount /tmp/fedora-root
          sudo losetup -d "$LOOP"

          xz -c /tmp/fedora.raw > /tmp/fedora.raw.xz
          SHA=$(sha256sum /tmp/fedora.raw.xz | awk '{print $1}')
          echo "Test image sha256: $SHA"

          # --- Serve the image over SLIRP (guest reaches host as 10.0.2.2).
          mkdir -p /tmp/http
          cp /tmp/fedora.raw.xz /tmp/http/test.raw.xz
          ( cd /tmp/http && python3 -m http.server 8000 >/tmp/http.log 2>&1 ) &
          HTTP_PID=$!

          # --- Boot QEMU with an emulated NVMe device + user-mode networking.
          # QEMU's -drive needs the backing file to exist; create a blank one.
          rm -f /tmp/install-disk.qcow2
          qemu-img create -f qcow2 /tmp/install-disk.qcow2 128M >/dev/null
          timeout 180 qemu-system-x86_64 \
            -kernel /tmp/vmlinuz \
            -initrd /tmp/install-initramfs.cpio.gz \
            -append "console=ttyS0 kexec_wipe_dev=/dev/nvme0n1 kexec_wipe_method=auto kexec_wipe_install=1 kexec_wipe_test=1 kexec_wipe_fedora_url=http://10.0.2.2:8000/test.raw.xz kexec_wipe_fedora_sha256=$SHA" \
            -nographic -no-reboot -m 512 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -drive file=/tmp/install-disk.qcow2,if=none,id=nvme0 \
            -device nvme,serial=deadbeef,drive=nvme0 \
            > /tmp/install-serial.log 2>&1 || true

          kill "$HTTP_PID" 2>/dev/null || true

          echo "--- Install serial output ---"
          cat /tmp/install-serial.log
          echo "--- End install serial output ---"

          # The init must have run the full install pipeline and booted the
          # freshly written root, which prints the marker before powering off.
          grep -q "Fedora installation complete" /tmp/install-serial.log
          grep -q "KEXEC-WIPE-TEST-INSTALL-BOOT-OK" /tmp/install-serial.log
          grep -q "Drive /dev/nvme0n1 has been sanitized" /tmp/install-serial.log
          echo "QEMU Fedora install test passed."

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"

  upload-release:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assemble self-contained wipe.sh
        run: ./build.sh

      - name: Build initramfs (with Docker for static nvme-cli)
        run: ./initramfs/build.sh --output=kexec-wipe-initramfs.cpio.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          INITRAMFS_VERSION=$(grep 'INITRAMFS_VERSION=' lib/kexec.sh | head -1 | cut -d'"' -f2)
          INITRAMFS_ASSET="kexec-wipe-initramfs-${INITRAMFS_VERSION}.cpio.gz"

          cp kexec-wipe-initramfs.cpio.gz "${INITRAMFS_ASSET}"

          gh release upload "${VERSION}" \
            wipe.sh \
            "${INITRAMFS_ASSET}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
